<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Caixa Limpa</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="logo">📩 Caixa Limpa</div>
      <div class="badge">MiniSaaS</div>
    </header>

    <main class="card">
      <h1>Deixe sua caixa de entrada só com o que importa.</h1>
      <p class="sub">
        O Caixa Limpa separa automaticamente seus e-mails em:
        <b>Importantes</b>, <b>Promoções</b>, <b>Notificações</b> e <b>Lixo</b>.
      </p>

      <form class="form" method="get" action="/auth/login">
        <label>Seu e-mail do Gmail</label>
        <input name="email" type="email" placeholder="seuemail@gmail.com" required />
        <button type="submit">Conectar com Google</button>
      </form>

      <div class="info">
        <div class="pill">✅ Promoções → após 2 dias</div>
        <div class="pill">✅ Notificações → após 1 dia</div>
        <div class="pill">✅ Atualizações → após 5 dias</div>
        <div class="pill">🗑️ Spam → lixeira</div>
      </div>

      <footer class="foot">
        <span>Backend: {{ base_url }}</span>
      </footer>
    </main>
  </div>
</body>
</html>
